# Local/self-hosted stack. For production, put a TLS-terminating reverse proxy
# (e.g. Caddy/nginx/managed load balancer) in front of `app`, and use a managed
# Postgres with backups and TLS.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: najditech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: najditech
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U najditech"], interval: 5s, retries: 10 }
  migrate:
    build: .
    env_file: .env
    command: ["npx", "tsx", "--conditions=react-server", "scripts/migrate.ts"]
    depends_on: { db: { condition: service_healthy } }
  app:
    build: .
    env_file: .env
    ports: ["127.0.0.1:3000:3000"]
    volumes: [storage:/app/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["npx", "tsx", "--conditions=react-server", "scripts/worker.ts"]
    volumes: [storage:/app/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
volumes: { pgdata: {}, storage: {} }
